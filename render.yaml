# ==============================================================================
# Render.com Blueprint Configuration
# Déploiement complet en 1 clic :
# 1. Base PostgreSQL infogérée (ekaly-db)
# 2. API REST Backend Express Node.js (ekaly-backend)
# 3. Application Web Frontend React Vite (ekaly-web)
# ==============================================================================

services:
  # 1. API REST Backend (Node.js + Express)
  - type: web
    name: ekaly-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ekaly-db
          property: connectionString

  # 2. Application Web Frontend (React Vite Statique)
  - type: static
    name: ekaly-web
    plan: free
    region: frankfurt
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ekaly-backend
          property: host

databases:
  # 3. Base de données PostgreSQL infogérée
  - name: ekaly-db
    plan: free
    region: frankfurt
    databaseName: ekaly
    user: ekaly_user
